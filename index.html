<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>SensiX — Gerador de Sensibilidade para Free Fire</title>

<meta
  name="description"
  content="SensiX — gerador de sensibilidade, DPI e botão de atirar para Free Fire."
>

<meta
  name="keywords"
  content="Free Fire, sensibilidade Free Fire, sensi, DPI, SensiX"
>

<meta
  name="robots"
  content="index, follow"
>

<link
  rel="canonical"
  href="https://theusx00.github.io/SensiX/"
>

<style>

:root{

  --bg:#05070b;
  --bg2:#0a0d14;

  --card:rgba(14,18,27,.94);
  --card2:#111722;

  --line:#27303e;

  --text:#f8fafc;
  --muted:#9aa5b5;

  --red:#ff304f;
  --orange:#ff7a18;

  --yellow:#ffc400;
  --green:#35e58b;

  --purple:#b85cff;

}

*{

  box-sizing:border-box;
  margin:0;
  padding:0;

}

html{

  scroll-behavior:smooth;

}

body{

  min-height:100vh;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color:var(--text);

  background:

    radial-gradient(
      circle at 50% -10%,
      rgba(255,48,79,.30),
      transparent 30%
    ),

    radial-gradient(
      circle at 100% 20%,
      rgba(255,122,24,.16),
      transparent 25%
    ),

    radial-gradient(
      circle at 0% 70%,
      rgba(184,92,255,.10),
      transparent 25%
    ),

    linear-gradient(
      180deg,
      #05070b,
      #080b11 55%,
      #05070b
    );

  overflow-x:hidden;

}

body::before{

  content:"";

  position:fixed;

  inset:0;

  pointer-events:none;

  opacity:.18;

  background-image:

    linear-gradient(
      rgba(255,255,255,.025) 1px,
      transparent 1px
    ),

    linear-gradient(
      90deg,
      rgba(255,255,255,.025) 1px,
      transparent 1px
    );

  background-size:45px 45px;

}

body::after{

  content:"";

  position:fixed;

  width:500px;
  height:500px;

  left:-250px;
  bottom:-250px;

  border-radius:50%;

  background:rgba(255,48,79,.08);

  filter:blur(70px);

  pointer-events:none;

}

/* HEADER */

header{

  position:relative;

  z-index:2;

  max-width:1150px;

  margin:auto;

  padding:22px 20px;

  display:flex;

  align-items:center;

  justify-content:space-between;

}

.logo{

  font-size:27px;

  font-weight:1000;

  letter-spacing:-1.5px;

  text-transform:uppercase;

}

.logo span{

  color:var(--red);

  text-shadow:
    0 0 20px
    rgba(255,48,79,.6);

}

.badge{

  border:1px solid var(--line);

  background:rgba(12,15,22,.85);

  padding:8px 13px;

  border-radius:999px;

  color:#c6ceda;

  font-size:11px;

  font-weight:800;

}

/* MAIN */

main{

  position:relative;

  z-index:1;

  max-width:1150px;

  margin:auto;

  padding:15px 20px 70px;

}

/* HERO */

.hero{

  text-align:center;

  padding:45px 0 40px;

}

.hero-tag{

  display:inline-block;

  padding:7px 13px;

  border-radius:999px;

  border:
    1px solid
    rgba(255,48,79,.35);

  background:
    rgba(255,48,79,.08);

  color:#ff7186;

  font-size:11px;

  font-weight:900;

  margin-bottom:18px;

}

.hero h1{

  font-size:
    clamp(43px,8vw,78px);

  line-height:.95;

  letter-spacing:-4px;

  font-weight:1000;

}

.hero h1 span{

  color:var(--red);

  text-shadow:
    0 0 35px
    rgba(255,48,79,.35);

}

.hero p{

  max-width:690px;

  margin:18px auto 0;

  color:var(--muted);

  line-height:1.65;

  font-size:15px;

}

/* CARDS */

.grid{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:18px;

}

.card{

  background:var(--card);

  border:1px solid var(--line);

  border-radius:22px;

  padding:23px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.38);

  backdrop-filter:blur(10px);

}

.card h2{

  font-size:19px;

  margin-bottom:19px;

}

/* FORM */

.form{

  display:grid;

  gap:14px;

}

label{

  display:block;

  color:#929dae;

  font-size:10px;

  font-weight:900;

  text-transform:uppercase;

  letter-spacing:.8px;

}

select,
textarea{

  width:100%;

  margin-top:7px;

  border:1px solid var(--line);

  border-radius:12px;

  background:var(--card2);

  color:white;

  outline:none;

}

select{

  padding:14px;

}

select:focus,
textarea:focus{

  border-color:var(--red);

  box-shadow:
    0 0 0 3px
    rgba(255,48,79,.08);

}

button{

  border:0;

  border-radius:13px;

  padding:14px 17px;

  font-weight:900;

  cursor:pointer;

  transition:.18s ease;

}

button:hover{

  transform:translateY(-1px);

}

button:active{

  transform:scale(.98);

}

.primary{

  width:100%;

  color:white;

  background:
    linear-gradient(
      135deg,
      var(--red),
      var(--orange)
    );

  box-shadow:
    0 8px 25px
    rgba(255,48,79,.18);

}

.secondary{

  color:white;

  background:#181e29;

  border:1px solid var(--line);

}

.models{

  margin-top:20px;

}

.chips{

  display:flex;

  flex-wrap:wrap;

  gap:7px;

  margin-top:9px;

}

.chip{

  color:#b9c1ce;

  background:#111620;

  border:1px solid var(--line);

  border-radius:9px;

  padding:7px 9px;

  font-size:10px;

}

/* RESULTADO */

.result{

  display:none;

}

.result.show{

  display:block;

}

.resultTop{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin-bottom:15px;

}

.preset{

  padding:7px 10px;

  border-radius:999px;

  background:#242b37;

  color:#fff;

  font-size:10px;

  font-weight:900;

}

.sensi{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:9px;

}

.stat{

  padding:15px;

  background:#090c12;

  border:1px solid var(--line);

  border-radius:14px;

}

.stat small{

  display:block;

  color:var(--muted);

  font-size:10px;

  margin-bottom:4px;

}

.stat strong{

  font-size:27px;

}

.dpi-box{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:9px;

  margin-top:10px;

}

.dpi{

  padding:15px;

  border-radius:14px;

  background:#090c12;

  border:1px solid var(--line);

}

.dpi span{

  display:block;

  color:var(--muted);

  font-size:10px;

  margin-bottom:4px;

}

.dpi strong{

  font-size:19px;

}

.actions{

  display:flex;

  gap:9px;

  margin-top:11px;

}

.actions button{

  flex:1;

}

.tip{

  margin-top:14px;

  color:#7f8999;

  font-size:11px;

  line-height:1.55;

}

/* PREMIUM */

.premium-wrap{

  margin-top:20px;

}

.premium{

  position:relative;

  overflow:hidden;

  border:
    1px solid
    rgba(184,92,255,.45);

  border-radius:23px;

  padding:24px;

  background:

    radial-gradient(
      circle at 100% 0%,
      rgba(184,92,255,.16),
      transparent 35%
    ),

    linear-gradient(
      145deg,
      #17111f,
      #0e1119
    );

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.35);

}

.premium-head{

  display:flex;

  align-items:flex-start;

  justify-content:space-between;

  gap:15px;

}

.premium h2{

  font-size:23px;

  margin-bottom:7px;

}

.premium h2 span{

  color:var(--purple);

}

.premium p{

  color:#a59caf;

  font-size:12px;

  line-height:1.55;

}

.premium-badge{

  flex-shrink:0;

  padding:8px 12px;

  border-radius:999px;

  background:
    linear-gradient(
      135deg,
      #b85cff,
      #6d28d9
    );

  font-size:10px;

  font-weight:900;

}

.premium-locked{

  margin-top:19px;

  padding:25px 18px;

  text-align:center;

  border-radius:17px;

  background:#0a090e;

  border:1px solid #30233b;

}

.lock-icon{

  font-size:38px;

  margin-bottom:9px;

}

.premium-locked h3{

  font-size:17px;

  margin-bottom:7px;

}

.premium-locked p{

  max-width:550px;

  margin:auto;

}

.dev-badge{

  display:inline-block;

  margin-top:15px;

  padding:9px 14px;

  border-radius:999px;

  background:#21182a;

  border:1px solid #68427d;

  color:#d29aff;

  font-size:10px;

  font-weight:900;

}

/* FEEDBACK */

.feedback-section{

  margin-top:20px;

  background:var(--card);

  border:1px solid var(--line);

  border-radius:22px;

  padding:23px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.35);

}

.feedback-header{

  display:flex;

  justify-content:space-between;

  align-items:flex-start;

  gap:15px;

}

.feedback-section h2{

  font-size:20px;

}

.feedback-section p{

  color:var(--muted);

  font-size:12px;

  margin-top:5px;

}

.rating-summary{

  text-align:right;

}

.rating-average{

  font-size:27px;

  font-weight:1000;

}

.rating-stars{

  color:var(--yellow);

  letter-spacing:1px;

}

.feedback-stars{

  display:flex;

  gap:3px;

  margin:20px 0 10px;

}

.feedback-star{

  padding:2px;

  background:none;

  color:#4b5260;

  font-size:34px;

  border:0;

}

.feedback-star.active{

  color:var(--yellow);

  text-shadow:
    0 0 15px
    rgba(255,196,0,.3);

}

#feedbackText{

  min-height:105px;

  resize:vertical;

  padding:13px;

  font-family:inherit;

  font-size:13px;

}

.feedback-submit{

  width:100%;

  margin-top:10px;

  color:white;

  background:
    linear-gradient(
      135deg,
      var(--red),
      var(--orange)
    );

}

#feedbackMessage{

  min-height:18px;

  margin-top:9px;

}

/* COMUNIDADE */

.community{

  margin-top:20px;

  background:var(--card);

  border:1px solid var(--line);

  border-radius:22px;

  padding:23px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.35);

}

.community h2{

  font-size:20px;

}

.community-sub{

  color:var(--muted);

  font-size:12px;

  margin-top:5px;

}

.feedback-list{

  display:grid;

  gap:10px;

  margin-top:17px;

}

.feedback-item{

  background:#090c12;

  border:1px solid var(--line);

  border-radius:14px;

  padding:14px;

}

.feedback-item-top{

  display:flex;

  justify-content:space-between;

  gap:10px;

  align-items:center;

}

.feedback-item-stars{

  color:var(--yellow);

  letter-spacing:1px;

  font-size:14px;

}

.feedback-date{

  color:#687181;

  font-size:9px;

}

.feedback-comment{

  color:#c5ccd7;

  font-size:12px;

  line-height:1.5;

  margin-top:8px;

  word-break:break-word;

}

.empty-feedback{

  color:#737d8d;

  padding:22px 5px;

  text-align:center;

  font-size:12px;

  border:1px dashed var(--line);

  border-radius:13px;

}

.community-actions{

  display:flex;

  justify-content:flex-end;

  margin-top:12px;

}

.clear-feedback{

  color:#8993a3;

  background:#141923;

  border:1px solid var(--line);

  padding:9px 12px;

  font-size:10px;

}

/* FOOTER */

footer{
