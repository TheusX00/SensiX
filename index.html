/* =========================
   ELEMENTOS
========================= */

const brand = document.getElementById("brand");
const model = document.getElementById("model");
const chips = document.getElementById("chips");

const style = document.getElementById("style");
const profile = document.getElementById("profile");


/* =========================
   CARREGAR MODELOS
========================= */

function loadModels(){

  model.innerHTML = "";

  const list = models[brand.value] || models.Outros;

  list.forEach((item,index)=>{

    const name = item[0];
    const hz = item[1];

    const option = document.createElement("option");

    option.value = index;

    option.textContent = hz
      ? `${name} — ${hz}Hz`
      : name;

    model.appendChild(option);

  });

  chips.innerHTML = list
    .slice(0,7)
    .map(item =>
      `<span class="chip">${item[0]} • ${item[1]}Hz</span>`
    )
    .join("");

  /*
    SOMENTE NO IPHONE:
    troca as opções de estilo Android
    por Baixo / Médio / Alto.
  */

  if(brand.value === "iPhone"){

    style.innerHTML = `
      <option value="baixo">Baixo</option>
      <option value="medio">Médio</option>
      <option value="alto">Alto</option>
    `;

  }else{

    style.innerHTML = `
      <option value="capa">🔥 Capa / Headshot</option>
      <option value="rush">⚡ Rush</option>
      <option value="precisao">🎯 Precisão</option>
      <option value="equilibrada">⚖️ Equilibrada</option>
    `;

  }

}


brand.addEventListener("change",loadModels);

loadModels();


/* =========================
   UTILITÁRIO
========================= */

function clamp(value,min,max){

  return Math.max(
    min,
    Math.min(max,Math.round(value))
  );

}


/* =========================
   NÚMERO ALEATÓRIO
========================= */

function randomBetween(min,max){

  return Math.floor(
    Math.random() * (max - min + 1)
  ) + min;

}


/* =========================
   SENSI PARA IPHONE
========================= */

function generateIphoneSensi(level){

  let base;

  if(level === "baixo"){

    base = randomBetween(100,135);

  }else if(level === "medio"){

    base = randomBetween(135,170);

  }else{

    base = randomBetween(170,200);

  }

  return {

    geral: clamp(base,100,200),

    redDot: clamp(
      base + randomBetween(-5,5),
      100,
      200
    ),

    mira2x: clamp(
      base + randomBetween(-8,8),
      100,
      200
    ),

    mira4x: clamp(
      base + randomBetween(-10,10),
      100,
      200
    ),

    miraSniper: clamp(
      base + randomBetween(-12,12),
      100,
      200
    ),

    olhadinha: clamp(
      base + randomBetween(-6,6),
      100,
      200
    )

  };

}

min,
Math.min(max,Math.round(value))
);

function generate(){

  const name = item[0];
  const hz = item[1];
  const maxDpi = item[2];

  const style = document.getElementById("style").value;
  const profile = document.getElementById("profile").value;

  /* =========================

  ========================= */

  if(brand.value === "iPhone"){

    }

    else{
      base = 170 + Math.floor(Math.random() * 31);
    }

    const variacao = Math.floor(Math.random() * 8);

    const geral = clamp(base,100,200);
    const redDot = clamp(base + variacao,100,200);
    const mira2x = clamp(base - 3 + variacao,100,200);
    const mira4x = clamp(base - 7 + variacao,100,200);
    const awm = clamp(base - 12 + variacao,100,200);
    const olhar = clamp(base + 5,100,200);

    document.getElementById("preset").textContent =
      faixa.toUpperCase();

    document.getElementById("stats").innerHTML = `
      <div class="stat">

      </div>

      </div>

        <small>Mira 2x</small>
        <strong>${mira2x}</strong>
      </div>

        <small>Mira 4x</small>
        <strong>${mira4x}</strong>
      </div>

      <div class="stat">
        <small>Mira AWM</small>
        <strong>${awm}</strong>
      </div>

      <div class="stat">
        <small>Olhadinha</small>
        <strong>${olhar}</strong>

    document.getElementById("result").classList.add("show");

    window.lastConfig = {
      name,
      preset: faixa,
      geral,
      redDot,
      mira2x,
      mira4x,
      awm,
      olhar
    };

    return;
  }


  /* =========================
     ANDROID
  ========================= */

  let base = 155;

  if(hz >= 165){
    base = 165;
  }
  else if(hz >= 144){
    base = 162;
  }
  else if(hz >= 120){
    base = 158;
  }
  else if(hz >= 90){

  }

    clamp(base - 2 + Math.floor(Math.random()*5),100,200);

  const mira4x =
    clamp(base - 7 + Math.floor(Math.random()*5),100,200);

  const awm =

  const olhar =

  let dpi = maxDpi || 900;

  if(dpi > 0){
    dpi += Math.floor(Math.random()*41) - 20;
  }

  document.getElementById("btnSize").textContent =

  document.getElementById("result").classList.add("show");


  window.lastConfig = {
    name,
    style,
    profile,
    geral,
    redDot,
    mira2x,

/* =========================
   FEEDBACK
========================= */

let selectedRating = 0;

const stars =
  document.querySelectorAll(".feedback-star");


stars.forEach(star => {

  star.addEventListener("click",function(){

    selectedRating =
      Number(this.dataset.star);

    stars.forEach(s => {

      s.classList.toggle(
        "active",
        Number(s.dataset.star) <= selectedRating
      );

    });

  });

});


function getFeedbacks(){

  try{

    return JSON.parse(
      localStorage.getItem("sensix_feedbacks")
    ) || [];

  }

  catch(e){

    return [];

  }

}


function saveFeedbacks(data){

  localStorage.setItem(
    "sensix_feedbacks",
    JSON.stringify(data)
  );

}


function sendFeedback(){

  const text =
    document.getElementById("feedbackText").value.trim();

  const message =
    document.getElementById("feedbackMessage");


  if(selectedRating === 0){

    message.textContent =
      "⭐ Escolha uma nota antes de enviar.";

    return;

  }


  if(!text){

    message.textContent =
      "✍️ Escreva uma opinião antes de enviar.";

    return;

  }


  const feedbacks = getFeedbacks();


  feedbacks.unshift({

    rating:selectedRating,

    text:text,

    date:new Date().toLocaleDateString("pt-BR")

  });


  saveFeedbacks(feedbacks);


  document.getElementById("feedbackText").value = "";

  selectedRating = 0;


  stars.forEach(s =>
    s.classList.remove("active")
  );


  message.textContent =
    "✅ Avaliação enviada com sucesso!";


  renderFeedbacks();

  updateAverage();

}


function renderFeedbacks(){

  const list =
    document.getElementById("feedbackList");

  const feedbacks =
    getFeedbacks();


  if(feedbacks.length === 0){

    list.innerHTML =
      `<div class="empty-feedback">
        Ainda não existem avaliações neste dispositivo.
      </div>`;

    return;

  }


  list.innerHTML =
    feedbacks.map(item => `

      <div class="feedback-item">

        <div class="feedback-item-top">

          <div class="feedback-item-stars">
            ${"★".repeat(item.rating)}
            ${"☆".repeat(5-item.rating)}
          </div>

          <div class="feedback-date">
            ${item.date}
          </div>

        </div>

        <div class="feedback-comment">
          ${escapeHTML(item.text)}
        </div>

      </div>

    `).join("");

}


function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


function updateAverage(){

  const feedbacks =
    getFeedbacks();


  if(feedbacks.length === 0){

    document.getElementById("averageRating").textContent =
      "0.0";

    document.getElementById("averageStars").textContent =
      "☆☆☆☆☆";

    return;

  }


  const total =
    feedbacks.reduce(
      (sum,item) => sum + item.rating,
      0
    );


  const average =
    total / feedbacks.length;


  document.getElementById("averageRating").textContent =
    average.toFixed(1);


  const rounded =
    Math.round(average);


  document.getElementById("averageStars").textContent =
    "★".repeat(rounded) +
    "☆".repeat(5-rounded);

}


function clearFeedbacks(){

  if(
    !confirm(
      "Tem certeza que deseja apagar todas as avaliações deste dispositivo?"
    )
  ){

    return;

  }


  localStorage.removeItem(
    "sensix_feedbacks"
  );


  renderFeedbacks();

  updateAverage();

}


/* =========================
   INICIALIZAÇÃO
========================= */

renderFeedbacks();

updateAverage();


</script>
